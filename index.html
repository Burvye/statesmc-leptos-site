<!doctype html>
<html>
    <link data-trunk rel="copy-dir" href="assets/" />
    <head>
        <title>Document</title>
    </head>
    <style>
        :root {
            --bg: #120f10;
            --surface: #1b1718;
            --surface-2: #241f21;
            --text: #f2efec;
            --muted: #c9bfb8;

            --red: #d94b4b;
            --red-deep: #8f2424;
            --cyan: #39d6e8;
            --cyan-deep: #0d8b9b;

            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }
        * {
            margin: 0;
            padding: 0;
            border: 0;
        }
        body {
            background-color: var(--bg);
        }
        .title {
            font-family: Helvetica;
            font-weight: bold;
        }
        .title1 {
            font-size: 350%;
            color: #cc3900;
            border-radius: 15px;
        }
        .title2 {
            font-size: 200%;
            color: var(--muted);
        }
        .parent {
            display: grid;
        }
        .body-parent {
            display: grid;
            grid-template-columns: 1fr, 2fr;
        }
        .simage {
            background-image: url("assets/statesmc.png");
            background-size: cover;
        }
        .header {
            grid-template-columns: 1fr 3fr;
        }
        .butt {
            background-color: var(--cyan);
        }
        .space {
            margin: 4mm 4mm;
        }
        .body {
            grid-template-columns: 1fr 3fr;
        }
        .child {
            display: grid;
            height: 100px;
        }
        .header-child {
            background-color: var(--surface);
            place-content: center;
            margin: 0mm 2mm;
        }
        .map-child {
            background-color: var(--surface-2);
            min-height: 400px;
        }
        .map-parent {
            grid-template-columns: 1fr 1fr;
        }
        .body-main {
            display: grid;
            background-color: var(--cyan-deep);
            grid-template-columns: repeat(2, 1fr);
        }
        .text {
            color: var(--text);
            font-family: Helvetica;
            font-weight: 900;
        }
        .body-child {
            color: var(--text);
            margin: 2mm 2mm;
            font-family: Helvetica;
            font-weight: bold;
            text-align: center;
            height: 96%;
        }
        .body-side {
            background-color: var(--surface-2);
            font-family: Helvetica;
        }
        .main-button {
            background-color: var(--cyan);
            margin: 2mm 2mm;
            padding: 5%;
            font-family: monospace;
        }
        .body-two {
            display: block;
            background-color: var(--surface-2);
            margin: 2mm;
        }
        .infant {
            display: grid;
            background-color: var(--red);
            place-content: center;
        }
        #main-button-info {
            font-family: Helvetica;
            font-size: 100%;
            padding-left: 4mm;
            padding-top: 2mm;
            font-weight: bold;
            color: var(--text);
        }
    </style>
    <body></body>
</html>
